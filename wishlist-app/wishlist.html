<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 위시리스트</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;color:#292735;background:transparent;font-size:14px}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #b5a1f8;outline-offset:2px}.panel{background:white;border:1px solid #e5e3ec;border-radius:14px;box-shadow:0 6px 22px #26203718;overflow:hidden;height:calc(100dvh - 16px);display:flex;flex-direction:column}header{display:flex;align-items:center;gap:9px;padding:18px 18px 14px}h1{font-size:16px;margin:0;font-weight:750;flex:1}.heart{color:#8b5cf6;font-size:22px}.count{background:#f0eaff;color:#7950db;font-size:12px;padding:3px 7px;border-radius:6px}.icon{border:0;background:transparent;border-radius:7px;color:#8e8a9b;display:grid;place-items:center;width:32px;height:32px}.icon:hover{background:#f2eff8;color:#7752d6}svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.intro{margin:0;padding:0 18px 16px;color:#94909f;font-size:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid #f1eff5;color:#9893a3;font-size:12px}.sorting{display:flex;align-items:center;gap:5px;color:#6e657e}select{border:0;background:#fff;color:#6e657e;font-size:12px;max-width:110px;padding:5px 0}#list{overflow:auto;flex:1;padding:0 10px 10px}.row{display:flex;align-items:center;border:1px solid #eeeaf4;border-radius:9px;margin:0 4px 8px;padding:5px}.row:hover{border-color:#c8b6f1;background:#fcfaff}.visit{border:0;background:transparent;display:flex;gap:10px;align-items:center;text-align:left;flex:1;min-width:0;padding:10px 6px;color:#302d3b}.badge{background:#f3effc;color:#8863cc;min-width:38px;padding:7px 5px;border-radius:7px;text-align:center;font-size:11px}.name{flex:1;overflow-wrap:anywhere;font-weight:600;font-size:13px}.go{color:#aaa2bb}.delete:hover{color:#db667a;background:#fff0f2}footer{padding:13px 18px;background:#faf9fc;border-top:1px solid #eeeaf3;color:#9b94a6;font-size:11px}.empty{text-align:center;padding:38px 12px;color:#a49bac;line-height:1.9}.empty strong{display:block;color:#6b6277;font-size:14px}.empty .heart{display:block;font-size:32px;margin-bottom:12px}#status{font-size:12px;color:#7752c1;padding:0 18px 9px;overflow-wrap:anywhere}#status:empty{display:none}.collapsed .intro,.collapsed .toolbar,.collapsed #list,.collapsed footer,.collapsed #status{display:none}.collapsed{height:auto}button:disabled,select:disabled{opacity:.45;cursor:default}@media(max-width:260px){header{padding:12px 10px;gap:5px}h1{font-size:14px}.intro,.toolbar,footer{padding-left:10px;padding-right:10px}.badge{min-width:30px}.visit{gap:6px}}
</style>
<section class="panel" id="panel"><header><span class="heart" aria-hidden="true">♡</span><h1>내 위시리스트</h1><span id="count" class="count">—</span><button class="icon" id="toggle" title="접기" aria-label="위시리스트 접기"><svg viewBox="0 0 24 24"><path id="chevron" d="m6 15 6-6 6 6"/></svg></button></header><p class="intro">마음에 드는 부스를 모아두세요.</p><div class="toolbar"><span>저장한 부스</span><label class="sorting"><svg viewBox="0 0 24 24"><path d="M8 4v16m-4-4 4 4 4-4M15 5h6m-6 5h4m-4 5h2"/></svg><select id="sort" aria-label="부스 정렬" disabled><option value="recent">최근 추가순</option><option value="number">부스 번호순</option><option value="name">이름순</option></select></label></div><div id="list"><div class="empty">불러오는 중…</div></div><div id="status" role="status" aria-live="polite"></div><footer>♡ 하트에서 F키로 추가 · 목록을 누르면 부스로 이동</footer></section>
<script>
(function(){
'use strict';
var list=document.getElementById('list'),sort=document.getElementById('sort');
function post(data){window.parent.postMessage(data,'*');}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e;}
function svg(path){var s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');var p=document.createElementNS(s.namespaceURI,'path');p.setAttribute('d',path);s.appendChild(p);return s;}
window.addEventListener('message',function(event){
if(event.source!==window.parent)return;var d=event.data;if(!d||d.type!=='state')return;
document.getElementById('panel').classList.toggle('collapsed',!!d.collapsed);
var toggle=document.getElementById('toggle');toggle.title=d.collapsed?'펼치기':'접기';toggle.setAttribute('aria-label','위시리스트 '+toggle.title);toggle.setAttribute('aria-expanded',String(!d.collapsed));document.getElementById('chevron').setAttribute('d',d.collapsed?'m6 9 6 6 6-6':'m6 15 6-6 6 6');
list.replaceChildren();sort.disabled=!!d.error;
if(d.error){document.getElementById('count').textContent='—';document.getElementById('status').textContent=d.error;return;}
if(!Array.isArray(d.items))return;
sort.value=d.sort;var items=d.items.slice();if(d.sort==='recent')items.reverse();else items.sort(function(a,b){return d.sort==='number'?(Number(a.number)-Number(b.number)||a.number.localeCompare(b.number)):a.name.localeCompare(b.name,'ko')||Number(a.number)-Number(b.number);});
document.getElementById('count').textContent=items.length;document.getElementById('status').textContent=d.message||'';
if(!items.length){var empty=el('div','empty');empty.append(el('span','heart','♡'),el('strong','','아직 저장한 부스가 없어요'),el('span','','부스의 하트에 다가가 F키를 눌러보세요.'));list.append(empty);}
items.forEach(function(item){var row=el('div','row'),visit=el('button','visit');visit.type='button';visit.title=item.name+' 부스로 이동';visit.setAttribute('aria-label',item.number+'번 '+visit.title);visit.append(el('span','badge',item.number),el('span','name',item.name),svg('m9 5 7 7-7 7'));visit.onclick=function(){post({type:'move',number:item.number});};var del=el('button','icon delete');del.type='button';del.title='삭제';del.setAttribute('aria-label',item.name+' 삭제');del.append(svg('M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5'));del.onclick=function(){post({type:'delete',number:item.number});};row.append(visit,del);list.append(row);});
});
sort.onchange=function(){post({type:'sort',sort:sort.value});};document.getElementById('toggle').onclick=function(){post({type:'toggle'});};post({type:'ready'});
}());
</script></html>
