<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>위시리스트 펼치기</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{display:grid;place-items:center;font-family:'Malgun Gothic',sans-serif}button{position:relative;display:grid;place-items:center;width:48px;height:48px;border:1px solid #e2d7f8;border-radius:14px;background:#fff;color:#8452d5;cursor:pointer;box-shadow:0 2px 7px #49326b20}button:hover{background:#f5efff}button:focus-visible{outline:3px solid #b5a1f8;outline-offset:2px}svg{width:25px;height:25px;fill:#f1e8ff;stroke:currentColor;stroke-width:1.8}.count{position:absolute;right:-3px;top:-4px;min-width:17px;padding:2px 4px;border:2px solid white;border-radius:10px;background:#8754d6;color:white;font-size:9px;line-height:11px}</style>
<button id="expand" type="button" title="위시리스트 펼치기" aria-label="위시리스트 펼치기" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg><span id="count" class="count" hidden></span></button>
<script>
(function(){'use strict';var button=document.getElementById('expand'),count=document.getElementById('count');button.onclick=function(){window.parent.postMessage({type:'toggle'},'*');};window.addEventListener('message',function(e){if(e.source!==window.parent||!e.data||e.data.type!=='state')return;var d=e.data;if(d.error){count.hidden=false;count.textContent='!';button.title='기록 확인 필요 · 위시리스트 펼치기';button.setAttribute('aria-label',button.title);return;}if(!Array.isArray(d.items))return;var n=d.items.length;count.hidden=n===0;count.textContent=n>99?'99+':String(n);button.title='위시리스트 '+n+'개 · 펼치기';button.setAttribute('aria-label',button.title);});window.parent.postMessage({type:'ready'},'*');}());
</script></html>
