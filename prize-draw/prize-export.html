<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>당첨 목록 내보내기</title><style>
*{box-sizing:border-box}body{margin:0;font:14px "Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#20392e;background:transparent}.backdrop{min-height:100vh;display:grid;place-items:center;background:#102722ad;padding:16px}.card{width:min(100%,620px);border-radius:24px;background:#f6f5ef;padding:28px;box-shadow:0 20px 90px #11251b40}header{display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:10px;font-weight:bold;letter-spacing:2px;color:#70806b}h1{font-size:25px;letter-spacing:-1px;margin:16px 0 10px}p{line-height:1.7;color:#768173;font-size:13px}.close{background:transparent;border:1px solid #d7ddcf;border-radius:50%;width:32px;height:32px;font-size:22px;color:#20392e;cursor:pointer}.summary{padding:17px;background:#e8eddb;border-radius:12px;font-weight:700;margin:18px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:#203c30;color:white;font-weight:700}.secondary{background:#e4e9db;color:#203c30}button:disabled{opacity:.4;cursor:wait}button:focus-visible,textarea:focus-visible{outline:3px solid #829c42;outline-offset:3px}textarea{display:block;width:100%;min-height:160px;resize:vertical;margin-top:10px;background:white;border:1px solid #d4ddca;border-radius:10px;padding:12px;font:11px monospace;color:#35462d}details{margin-top:22px;color:#71806a;font-size:12px}summary{cursor:pointer}#status{min-height:24px}footer{font-size:11px;line-height:1.7;color:#8a9283;border-top:1px solid #dce1d3;padding-top:16px;margin-top:20px}@media(max-width:420px){.card{padding:20px}h1{font-size:22px}.backdrop{padding:8px}}</style></head><body>
<div class="backdrop"><main class="card" role="dialog" aria-modal="true" aria-labelledby="title"><header><span class="eyebrow">PRIZE RECORDS</span><button class="close" id="close" aria-label="닫기">×</button></header><h1 id="title">당첨 목록 내보내기</h1><p>현재 회차의 당첨 기록을 문서로 보관하세요.<br>CSV 파일은 엑셀이나 스프레드시트에서 열 수 있습니다.</p><div class="summary" id="summary">당첨 기록을 불러오고 있어요…</div><div class="actions"><button id="download" disabled>CSV 다운로드</button><button class="secondary" id="copy" disabled>내용 복사</button></div><p id="status" role="status" aria-live="polite"></p><details id="fallback"><summary>다운로드·복사가 안 되나요? CSV 원문 보기</summary><p>아래 내용을 전체 선택해서 복사한 뒤 UTF-8 CSV 파일로 저장해주세요.</p><textarea id="csv" readonly aria-label="당첨 목록 CSV 원문" spellcheck="false"></textarea></details><footer id="generated"></footer><footer>현재 회차만 포함되며 초기화로 삭제된 기록은 복구되지 않습니다.<br>로그인 참여자는 이메일 해시, 비로그인 참여자는 게스트 방문 식별값으로 표시합니다.</footer></main></div>
<script>
(function(){'use strict';var packet=null,blobUrl=null;var download=document.getElementById('download'),copy=document.getElementById('copy'),raw=document.getElementById('csv'),status=document.getElementById('status');
function send(type){window.parent.postMessage({type:type},'*');}function close(){if(blobUrl)URL.revokeObjectURL(blobUrl);send('close');if(window.parent===window)document.querySelector('.backdrop').hidden=true;}
document.getElementById('close').onclick=close;document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});document.getElementById('close').focus();
window.addEventListener('message',function(e){if(e.source!==window.parent)return;var d=e.data;if(!d||d.type!=='export'||typeof d.csv!=='string'||typeof d.filename!=='string'||!Number.isInteger(d.count)||d.count<0)return;packet=d;raw.value=d.csv;document.getElementById('summary').textContent='회차 R'+d.round+' · 당첨 기록 '+d.count+'건';document.getElementById('generated').textContent='조회 시각: '+d.generatedAt+' · 이 시점의 기록을 내보냅니다.';download.disabled=false;copy.disabled=false;});
download.onclick=function(){if(!packet)return;try{if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(new Blob([packet.csv],{type:'text/csv;charset=utf-8'}));var a=document.createElement('a');a.href=blobUrl;a.download=packet.filename.replace(/[^a-zA-Z0-9_.-]/g,'_');document.body.appendChild(a);a.click();a.remove();status.textContent='다운로드를 요청했습니다. 파일이 보이지 않으면 내용 복사나 CSV 원문 보기를 이용해주세요.';}catch(_){document.getElementById('fallback').open=true;status.textContent='이 환경에서는 다운로드가 제한됩니다. CSV 원문을 복사해 저장해주세요.';}};
copy.onclick=async function(){if(!packet)return;try{if(!navigator.clipboard)throw Error();await navigator.clipboard.writeText(packet.csv);status.textContent='당첨 목록 CSV를 복사했습니다.';}catch(_){document.getElementById('fallback').open=true;raw.focus();raw.select();status.textContent='CSV 원문을 선택했습니다. 복사 기능으로 내용을 복사해주세요.';}};
send('ready');var n=0,ready=setInterval(function(){if(packet||++n>20){clearInterval(ready);return;}send('ready');},600);setTimeout(function(){if(!packet)status.textContent='기록을 불러오지 못했습니다. 창을 닫고 !당첨내보내기를 다시 입력해주세요.';},15000);
})();</script></body></html>
