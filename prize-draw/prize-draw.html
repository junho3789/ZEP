<div class="backdrop"><main class="card" role="dialog" aria-modal="true" aria-labelledby="title"><div class="rays"></div><header class="top"><button class="close" aria-label="팝업 닫기">×</button></header><div class="heading"><span class="eyebrow">SPIN YOUR LUCK</span><h1 id="title"><span>2026 용봉학술제</span> <span style="display:block">AICOSS 이벤트</span></h1><p class="intro">행운의 룰렛을 돌려보세요!</p></div><div class="wheel-stage"><span class="star a" aria-hidden="true">✦</span><span class="star b" aria-hidden="true">✧</span><span class="star c" aria-hidden="true">✦</span><div class="rim"><div class="wheel-inner"><svg id="wheel" class="rotor" viewBox="0 0 400 400" role="img" aria-label="1등, 2등, 3등, 4등, 5등으로 동일하게 5분할된 원형 룰렛"></svg></div></div><div class="bulbs" aria-hidden="true"></div><div class="needle" aria-hidden="true"></div><div class="hub" aria-hidden="true">AICOSS</div><div class="badge" aria-hidden="true">YOUR LUCKY MOMENT</div></div><div class="status" id="statusText" role="status" aria-live="polite">이벤트 정보를 확인하고 있어요…</div><button id="retryButton" class="retry" hidden>다시 확인</button><button id="spinButton" class="spin" disabled><span class="icon" aria-hidden="true">↻</span><span id="buttonText">준비 중…</span></button><section id="result" class="result" hidden aria-live="polite"><div class="caption" id="resultCaption">나의 당첨 등수는</div><div id="rank" class="rank"></div><div id="prize" class="prize"></div><button class="done">확인했어요</button></section><canvas class="confetti" aria-hidden="true"></canvas></main></div>
<script>
(function(){'use strict';
var wheel=document.getElementById('wheel'),button=document.getElementById('spinButton'),buttonText=document.getElementById('buttonText'),card=document.querySelector('.card'),status=document.getElementById('statusText');

function fitLayout(){

var viewport=window.visualViewport?window.visualViewport.height:window.innerHeight,back=getComputedStyle(document.querySelector('.backdrop')),cs=getComputedStyle(card),remaining=viewport-parseFloat(back.paddingTop)-parseFloat(back.paddingBottom)-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-4;

var ss=getComputedStyle(stage);remaining-=(parseFloat(ss.marginTop)||0)+(parseFloat(ss.marginBottom)||0);var width=card.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);

for(var i=0;i<5;i++){var a=-126+i*72,b=a+72,p=point(a,200),q=point(b,200);svg('path',{d:'M200 200 L'+p[0]+' '+p[1]+' A200 200 0 0 1 '+q[0]+' '+q[1]+' Z',fill:fills[i],stroke:'#89b9e9','stroke-width':2,'data-rank':i+1});var center=-90+i*72,pos=point(center,128),g=svg('g',{transform:'translate('+pos[0]+','+pos[1]+') rotate('+(center+90)+')'});svg('rect',{x:-39,y:-25,width:78,height:50,rx:25,fill:'#fff','fill-opacity':.97},g);var text=svg('text',{x:0,y:2,'text-anchor':'middle','dominant-baseline':'middle','font-size':27,'font-weight':900,fill:i===0?'#0758b9':'#143d76','font-family':'sans-serif'},g);text.textContent=(i+1)+'등';}
for(var j=0;j<20;j++){var angle=j*18*Math.PI/180,bulb=document.createElement('i');bulb.className='bulb';bulb.style.left=(50+47.4*Math.sin(angle))+'%';bulb.style.top=(50-47.4*Math.cos(angle))+'%';document.querySelector('.bulbs').appendChild(bulb);}
function send(type){window.parent.postMessage({type:type},'*');}
function close(){clearTimeout(timer);clearTimeout(fallback);cancelAnimationFrame(confettiFrame);state='closed';send('close');if(window.parent===window)document.querySelector('.backdrop').hidden=true;}
document.querySelector('.close').onclick=close;document.querySelector('.done').onclick=close;document.querySelector('.close').focus();
document.addEventListener('keydown',function(e){if(e.key==='Escape')close();if(e.key==='Tab'){var controls=[document.querySelector('.close')];if(!button.disabled&&button.offsetParent)controls.push(button);if(!document.getElementById('retryButton').hidden)controls.push(document.getElementById('retryButton'));if(!document.getElementById('result').hidden)controls.push(document.querySelector('.done'));var first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
function applyRanks(d){if(!Array.isArray(d.ranks)||d.ranks.length!==5||!d.ranks.every(function(r){return r&&typeof r.name==='string';}))return;var texts=wheel.querySelectorAll('text');d.ranks.forEach(function(r,i){texts[i].textContent=r.name;});wheel.setAttribute('aria-label',d.ranks.map(function(r){return r.name;}).join(', ')+' 5분할 룰렛');}

function complete(d){if(state==='closed')return;clearTimeout(fallback);state='done';card.classList.add('complete');document.getElementById('resultCaption').textContent='나의 당첨 등수는';document.getElementById('rank').textContent=d.rank+' 당첨!';document.getElementById('prize').textContent=d.prize+(d.preview?' · 미리보기':'');document.getElementById('result').hidden=false;fitLayout();status.textContent='축하합니다! 행운의 주인공이 되었어요.';buttonText.textContent='당첨 결과 확인 완료';celebrate();}
