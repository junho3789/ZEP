<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>행운의 경품 추첨</title>
<style>
:root{color-scheme:light;--ink:#192d29;--muted:#738079;--lime:#d9f278;--cream:#f6f5ef}*{box-sizing:border-box}body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:transparent}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #819c35;outline-offset:4px}.backdrop{min-height:100vh;display:grid;place-items:center;padding:16px;background:#102722a8;backdrop-filter:blur(8px)}.card{position:relative;overflow:hidden;width:min(100%,490px);border-radius:28px;background:var(--cream);box-shadow:0 24px 100px #081c2440;border:1px solid #ffffffb0}.top{display:flex;align-items:center;justify-content:space-between;padding:23px 26px 0}.brand{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:800;letter-spacing:2px}.brand svg{width:20px;height:20px}.close{width:34px;height:34px;border:1px solid #dce0d4;border-radius:50%;background:transparent;color:var(--ink);font-size:23px;line-height:28px}.heading{text-align:center;padding:12px 16px 0}.eyebrow{font-size:10px;letter-spacing:3px;color:#7c8976;font-weight:700}.heading h1{font-size:29px;letter-spacing:-1.3px;margin:10px 0}.heading p{font-size:13px;color:var(--muted);margin:0;line-height:1.6}.stage{position:relative;margin:15px auto 0;width:350px;height:324px;max-width:100%}.halo{position:absolute;inset:0 0 18px;background:radial-gradient(ellipse,#e0edc9 0,transparent 69%)}.drum{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:244px;height:244px;border-radius:50%;border:5px solid #b7c7bc;background:radial-gradient(circle at 30% 20%,#ffffffb0,#e9f1e866 45%,#ceddd3a0);box-shadow:inset 0 0 0 3px #fafff9b0,0 6px 16px #1d493317;overflow:hidden}.drum:after{content:"";position:absolute;top:19px;left:30px;width:57px;height:105px;border-radius:100%;transform:rotate(37deg);background:linear-gradient(90deg,#ffffff8c,transparent);pointer-events:none}canvas{width:100%;height:100%;display:block}.axis{position:absolute;left:50%;top:108px;transform:translateX(-50%);border:2px solid #ffffffa0;width:28px;height:28px;border-radius:50%;background:#b5c5b180;box-shadow:0 0 0 5px #b9ccbb35}.support{position:absolute;left:50%;top:232px;transform:translateX(-50%);width:108px;height:40px;background:linear-gradient(90deg,#29493c,#4c6750,#29493c);clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}.base{position:absolute;left:50%;top:265px;transform:translateX(-50%);width:266px;height:51px;border-radius:12px 12px 18px 18px;background:linear-gradient(135deg,#294238,#18352d);box-shadow:0 9px 15px #244d2820;display:flex;align-items:center;justify-content:space-between;padding:0 19px;color:#c5d3bc}.base span{font-size:9px;letter-spacing:2px;font-weight:700}.led{height:6px;width:6px;background:var(--lime);border-radius:50%;box-shadow:0 0 8px #d9f278}.port{position:absolute;left:50%;top:249px;transform:translateX(-50%);width:64px;height:49px;border-radius:10px;background:#10251d;box-shadow:inset 0 2px 5px #0008;border:4px solid #43594a}.hero-ball{z-index:3;position:absolute;left:calc(50% - 40px);top:209px;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 24%,#f7ffb2,#d9f278 55%,#a7c046);box-shadow:inset -5px -8px 9px #607a302c,0 10px 15px #17392330;opacity:0;transform:translateY(-105px) scale(.25);font-weight:900;font-size:26px}.hero-ball:before{content:"";position:absolute;inset:15px;border-radius:50%;background:#ffffffdd;box-shadow:0 2px 3px #44602125}.hero-ball span{position:relative}.won .hero-ball{animation:pop .95s cubic-bezier(.16,.8,.3,1) forwards}@keyframes pop{0%{opacity:0;transform:translateY(-100px) scale(.25) rotate(-40deg)}35%{opacity:1}65%{transform:translateY(4px) scale(1.08) rotate(5deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}.status{margin:0 28px 20px;padding:12px 16px;min-height:43px;border-radius:12px;background:#e9eddf;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:#61714e}.spinner{width:12px;height:12px;border:2px solid #bfcba4;border-top-color:#455e33;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.result{margin:0 28px 20px;border-top:1px solid #dde2d4;text-align:center;padding-top:17px}.result[hidden]{display:none}.rank{display:inline-block;font-size:11px;background:var(--lime);border-radius:20px;padding:5px 12px;font-weight:800}.prize{font-size:25px;font-weight:800;margin:10px 0;letter-spacing:-1px;overflow-wrap:anywhere}.receipt{font-size:10px;color:#7b8778;line-height:1.8;overflow-wrap:anywhere}.done{display:block;width:100%;border:0;border-radius:12px;background:#203c30;color:#f6f9ed;padding:13px;margin-top:17px;font-weight:700;font-size:13px}.footer{display:flex;justify-content:center;gap:7px;padding:0 20px 19px;color:#8c9588;font-size:10px}.confetti{position:absolute;width:7px;height:12px;top:110px;left:50%;opacity:0;pointer-events:none}.celebrate .confetti{animation:confetti 1.7s ease-out forwards}@keyframes confetti{10%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}.error .status{background:#f0e6dc;color:#8e5f40}.error .spinner,.won .spinner{display:none}.won .status{background:#e7edd8}.won .heading h1{color:#294d32}.error .stage{opacity:.55}@media(max-width:420px){.backdrop{padding:8px}.card{border-radius:22px}.top{padding:16px 19px 0}.heading h1{font-size:25px}.stage{transform:scale(.89);margin-top:0;margin-bottom:-33px}.status,.result{margin-left:18px;margin-right:18px}.prize{font-size:22px}}@media(max-height:650px){.backdrop{align-items:start}.heading{padding-top:3px}.heading h1{margin:6px 0}.stage{transform:scale(.82);height:276px;margin-top:-10px;margin-bottom:-20px}.top{padding-top:12px}.footer{padding-bottom:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition:none!important}.won .hero-ball{opacity:1;transform:none}.confetti{display:none}}
</style>
</head>
<body>
<div class="backdrop"><main class="card" role="dialog" aria-modal="true" aria-labelledby="title">
<header class="top"><div class="brand"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2l2.8 6.7L22 12l-7.2 3.3L12 22l-2.8-6.7L2 12l7.2-3.3L12 2z" fill="currentColor"/></svg>LUCKY MOMENT</div><button class="close" aria-label="팝업 닫기">×</button></header>
<div class="heading"><span class="eyebrow">A LITTLE LUCK, JUST FOR YOU</span><h1 id="title">당신의 행운을 뽑는 중</h1><p id="subtitle">어떤 경품이 기다리고 있을까요?</p></div>
<div class="stage" aria-hidden="true"><div class="halo"></div><div class="support"></div><div class="drum"><canvas id="balls"></canvas><div class="axis"></div></div><div class="base"><span>LUCKY DRAW</span><i class="led"></i></div><div class="port"></div><div class="hero-ball"><span id="ballNumber">?</span></div></div>
<div class="status" role="status" aria-live="polite"><i class="spinner" aria-hidden="true"></i><span id="statusText">추첨볼을 섞고 있어요…</span></div>
<section class="result" id="result" hidden aria-live="polite"><span class="rank" id="rank"></span><div class="prize" id="prize"></div><div class="receipt" id="receipt"></div><button class="done">확인했어요</button></section>
<footer class="footer"><span>작은 공 하나에 담긴 특별한 행운</span><span>✦</span></footer>
</main></div>
<script>
(function(){
'use strict';
var card=document.querySelector('.card'), canvas=document.getElementById('balls'), ctx=canvas.getContext('2d');
var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var started=performance.now(), resolved=false, received=false, timer=null, frame=0, last=0, mode='mixing', animationStopped=false;
var colors=['#d9f278','#ffd778','#f2a2a4','#9fcce3','#b7a5da'];
var balls=Array.from({length:24},function(_,i){var a=i*2.39996,r=28+Math.sqrt(i/24)*62;return{x:117+Math.cos(a)*r,y:122+Math.sin(a)*r,vx:(Math.random()-.5)*3.2,vy:(Math.random()-.5)*3.2,color:colors[i%5],number:i%5+1};});
function send(type){window.parent.postMessage({type:type},'*');}
function close(){clearTimeout(timer);animationStopped=true;cancelAnimationFrame(frame);send('close');if(window.parent===window) document.querySelector('.backdrop').hidden=true;}
document.querySelector('.close').onclick=close;document.querySelector('.done').onclick=close;
document.addEventListener('keydown',function(e){if(e.key==='Escape')close();if(e.key==='Tab'){var controls=[document.querySelector('.close')];if(!document.getElementById('result').hidden)controls.push(document.querySelector('.done'));var first=controls[0],end=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();end.focus();}else if(!e.shiftKey&&document.activeElement===end){e.preventDefault();first.focus();}}});
document.querySelector('.close').focus();
function resize(){var dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=234*dpr;canvas.height=234*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
resize();
function paint(time){if(animationStopped)return;var dt=Math.min((time-last)/16.67||1,2);last=time;ctx.clearRect(0,0,234,234);balls.forEach(function(b){
if(!reduced){if(mode==='mixing'){b.vy+=.035*dt;b.vx+=(Math.random()-.5)*.16*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;var dx=b.x-117,dy=b.y-117,len=Math.sqrt(dx*dx+dy*dy);if(len>96){var nx=dx/len,ny=dy/len,dot=b.vx*nx+b.vy*ny;b.x=117+nx*96;b.y=117+ny*96;b.vx-=2*dot*nx;b.vy-=2*dot*ny;}b.vx=Math.max(-4,Math.min(4,b.vx));b.vy=Math.max(-4,Math.min(4,b.vy));}else{b.y+=(Math.min(196,154+(b.number%3)*17)-b.y)*.025*dt;}}
var g=ctx.createRadialGradient(b.x-5,b.y-6,1,b.x,b.y,17);g.addColorStop(0,'#ffffff');g.addColorStop(.25,b.color);g.addColorStop(1,b.color);ctx.fillStyle=g;ctx.shadowColor='#26452b25';ctx.shadowBlur=4;ctx.shadowOffsetY=3;ctx.beginPath();ctx.arc(b.x,b.y,15,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.fillStyle='#ffffffe0';ctx.beginPath();ctx.arc(b.x,b.y,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3b493b';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.number,b.x,b.y+.5);
});if(!reduced)frame=requestAnimationFrame(paint);}
frame=requestAnimationFrame(paint);
function notice(message){clearTimeout(timer);resolved=true;received=true;mode='idle';card.classList.remove('won','celebrate');card.classList.add('error');document.getElementById('title').textContent='잠시만요';document.getElementById('subtitle').textContent='아래 안내를 확인해주세요.';document.getElementById('statusText').textContent=message;document.getElementById('result').hidden=true;}
function reveal(data){mode='idle';card.classList.add('won');document.getElementById('title').textContent=data.repeated?'나의 당첨 경품':'축하합니다!';document.getElementById('subtitle').textContent=data.repeated?'이미 당첨된 경품을 다시 보여드려요.':'오늘의 행운이 당신에게 도착했어요.';document.getElementById('ballNumber').textContent=data.ball;document.querySelector('.hero-ball').style.background='radial-gradient(circle at 30% 24%,#fff,'+colors[Math.max(0,Math.min(4,(parseInt(data.ball,10)||1)-1))]+')';document.getElementById('statusText').textContent=data.repeated?'이전에 확인한 당첨 결과입니다.':'행운의 추첨볼이 나왔어요!';
timer=setTimeout(function(){document.getElementById('rank').textContent=data.rank+' 당첨';document.getElementById('prize').textContent=data.prize;document.getElementById('receipt').textContent='당첨번호 '+data.receipt+' · '+data.date;document.getElementById('result').hidden=false;card.classList.add('celebrate');},reduced||data.repeated?0:850);}
window.addEventListener('message',function(event){if(event.source!==window.parent)return;var d=event.data;if(!d||typeof d!=='object')return;if(d.type==='notice'){if(resolved)return;notice(String(d.message||'잠시 후 다시 시도해주세요.'));return;}if(d.type==='mixing'){received=true;return;}if(d.type!=='result'||resolved||typeof d.rank!=='string'||typeof d.prize!=='string'||typeof d.receipt!=='string'||typeof d.date!=='string')return;received=true;resolved=true;var delay=d.repeated||reduced?0:Math.max(0,3600-(performance.now()-started));document.getElementById('statusText').textContent=d.repeated?'나의 당첨 결과를 확인하고 있어요…':'행운의 공을 꺼내고 있어요…';timer=setTimeout(function(){reveal(d);},delay);});
for(var i=0;i<18;i++){var bit=document.createElement('i');bit.className='confetti';bit.style.background=colors[i%5];bit.style.setProperty('--x',((i%2?-1:1)*(40+Math.random()*190))+'px');bit.style.setProperty('--y',(100+Math.random()*330)+'px');bit.style.setProperty('--r',(Math.random()*700-350)+'deg');bit.style.animationDelay=(Math.random()*.2)+'s';card.appendChild(bit);}
send('ready');var readyCount=0,readyTimer=setInterval(function(){if(received||++readyCount>15){clearInterval(readyTimer);return;}send('ready');},700);
setTimeout(function(){if(!resolved)notice('추첨 결과 확인이 지연되고 있어요. 창을 닫고 오브젝트에서 다시 확인해주세요.');},25000);
// 브라우저 확인 전용. ZEP 원장에 접근하거나 경품을 배정하지 않습니다.
if(window.parent===window&&new URLSearchParams(location.search).get('preview')==='1'){setTimeout(function(){window.postMessage({type:'result',rank:'2등',ball:'2',prize:'2등 경품',receipt:'미리보기 · 실제 당첨 아님',date:'DEMO',repeated:false},'*');},800);}
})();
</script>
</body></html>
