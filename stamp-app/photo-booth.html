<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>POST:ME 아바타 폴라로이드</title>
<style>
:root{color-scheme:light;--lime:#dfff45;--blue:#0878ff;--ink:#151515}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--ink);font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif}
[hidden]{display:none!important}button{font:800 13px system-ui;cursor:pointer;min-height:44px;border:2px solid var(--ink);border-radius:14px;padding:9px 15px;background:var(--lime);color:var(--ink)}button:disabled{opacity:.55;cursor:wait}button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.screen{position:fixed;inset:0;height:100vh;height:100dvh;padding:calc(88px + env(safe-area-inset-top,0px)) 16px calc(100px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;background:#071020b5}
.stage{position:relative;width:min(320px,100%);aspect-ratio:1;border:2px solid var(--lime);border-radius:24px;display:grid;place-items:center;background:#10182055;box-shadow:5px 5px 0 var(--blue);color:white;text-align:center}
.badge{position:absolute;top:16px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:5px 12px;border-radius:20px;background:var(--lime);color:var(--ink);font-size:11px;font-weight:900;letter-spacing:1px}
#number{font-size:clamp(76px,22vw,126px);font-weight:950;line-height:1;color:var(--lime);text-shadow:5px 5px 0 var(--blue);font-variant-numeric:tabular-nums}.note{position:absolute;bottom:18px;left:10px;right:10px;font-size:12px;color:white;font-weight:700}
#cancel{position:fixed;top:max(88px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:2}
#loading{max-width:220px;line-height:1.7;font-size:14px;padding:12px}
#flash{position:fixed;inset:0;background:white;opacity:0;pointer-events:none}body.flashing #flash{opacity:.82}body.flashing .screen,body.flashing #cancel{visibility:hidden}
.result{width:min(380px,100%);height:100%;max-height:800px;display:flex;flex-direction:column;gap:12px;align-items:center;min-height:0}.picture{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center}.picture img{display:block;width:100%;height:100%;object-fit:contain;filter:none}
.controls{flex:none;width:100%;display:flex;flex-direction:column;gap:8px}.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.actions button{flex:1;padding:9px 7px;white-space:nowrap}#save{background:var(--blue);color:white}.hint{margin:0;text-align:center;font-size:11px;line-height:1.5;color:#fff}.error{width:min(340px,100%);border:2px solid var(--ink);border-radius:20px;padding:22px;background:var(--lime);box-shadow:5px 5px 0 var(--blue)}.error h1{font-size:20px;margin:0 0 12px}.error p{font-size:13px;line-height:1.7;overflow-wrap:anywhere}.error button{background:white}
@media(max-height:480px){.screen{padding-top:calc(80px + env(safe-area-inset-top,0px));padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}.stage{height:100%;width:auto;max-width:260px}.badge{top:8px;font-size:9px}.note{bottom:8px;font-size:10px}#number{font-size:74px}.result{flex-direction:row;width:min(650px,100%);gap:18px}.picture{height:100%;flex:1}.controls{width:220px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions #save{grid-column:1/-1}.error{max-height:100%;overflow:auto;padding:12px}#cancel{top:16px}}
@media(max-height:360px){.hint{display:none}}
@media(prefers-reduced-motion:reduce){body.flashing #flash{opacity:.22}}
</style>
</head>
<body>
<div class="screen">
  <section id="stage" class="stage" aria-label="폴라로이드 만들기">
    <div class="badge">POST:ME · NEW:TURN</div>
    <div id="loading" role="status">내 아바타를 불러오고 있어요.</div>
    <div id="number" role="status" aria-live="polite" hidden></div>
    <div class="note">잠시 포즈를 취해 주세요!</div>
  </section>
  <section id="result" class="result" aria-label="나의 아바타 폴라로이드" hidden>
    <div class="picture"><img id="card" alt="내 아바타와 닉네임이 담긴 NEW:TURN 폴라로이드"></div>
    <div class="controls">
      <div class="actions"><button id="save" type="button">PNG 저장</button><button id="retake" type="button">다시 만들기</button><button id="close" type="button">닫기 ×</button></div>
      <p id="hint" class="hint" role="status">저장이 안 되면 이미지를 길게 눌러 저장해 주세요.</p>
    </div>
  </section>
  <section id="error" class="error" role="alert" hidden>
    <h1>아바타를 확인해 주세요</h1><p id="error-text"></p>
    <div class="actions"><button id="retry" type="button">다시 불러오기</button><button id="error-close" type="button">닫기 ×</button></div>
  </section>
</div>
<button id="cancel" type="button">닫기 ×</button>
<div id="flash" aria-hidden="true"></div>

        try{await navigator.share({files:[file],title:'나의 NEW:TURN 폴라로이드'});el('hint').textContent='공유 메뉴에서 이미지 저장을 선택할 수 있습니다.';}catch(error){if(error.name!=='AbortError')download();}
      }else download();
    }catch(error){el('hint').textContent='이미지를 길게 누르거나 마우스 오른쪽 버튼으로 저장해 주세요.';}finally{el('save').disabled=false;}
  };
  ['cancel','close','error-close'].forEach(function(id){el(id).onclick=close;});el('retake').onclick=retake;el('retry').onclick=retake;
  document.addEventListener('keydown',function(event){if(event.key==='Escape')close();});
  document.addEventListener('visibilitychange',function(){if(document.hidden&&phase==='countdown')close();});
  window.addEventListener('pagehide',function(){stop();revoke();});
  window.addEventListener('message',function(event){
    if(event.source!==host||!event.data)return;
    if(event.data.type==='photo_start')start(event.data);
    if(event.data.type==='photo_close_failed'){stop();phase='error';showError('창을 닫지 못했습니다. 닫기 버튼을 다시 눌러 주세요.');}
  });
  later(function(){if(phase==='waiting')close();},12000);post('photo_ready');
}());
</script>
</body>
</html>
