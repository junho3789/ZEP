<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스탬프 수집 열기</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#launcher{position:absolute;top:5px;left:5px;width:60px;height:60px;padding:6px;border:2px solid #171717;border-radius:15px;background:#dfff45;box-shadow:4px 4px 0 #0670ff;cursor:pointer;display:grid;place-items:center}
#launcher img{width:100%;height:100%;object-fit:contain;pointer-events:none}
#launcher:hover{background:#eaff92}
#launcher:focus-visible{outline:3px solid #0670ff;outline-offset:2px}
#launcher.complete{background:#0670ff}
@media(max-width:68px),(max-height:68px){#launcher{width:calc(min(100vw,100vh) - 14px);height:calc(min(100vw,100vh) - 14px);border-radius:10px}}
</style></head><body>
<button id="launcher" title="스탬프 수집 창 열기" aria-label="스탬프 수집 창 열기" aria-expanded="false"><img src="newton-stamp.png" alt="" draggable="false"></button>
<script>
(function(){
  'use strict';
  var launcher=document.getElementById('launcher');
  launcher.onclick=function(){
    launcher.blur();
    try{window.parent.focus();}catch(error){}
    window.parent.postMessage({type:'toggle'},'*');
  };
  window.addEventListener('message',function(event){
    if(event.source!==window.parent||!event.data||event.data.type!=='state')return;
    var state=event.data;
    launcher.classList.toggle('complete',!state.error&&state.count>=state.required);
    launcher.title=state.error?'스탬프 기록 확인 필요 · 클릭하여 열기':'스탬프 '+state.count+'/'+state.required+'개 · 클릭하여 열기';
    launcher.setAttribute('aria-label',launcher.title);
  });
  window.parent.postMessage({type:'ready'},'*');
}());
</script></body></html>
