<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>프로그램 참여</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#171717}body{display:grid;place-items:center;padding:18px;background:#0008}.dialog{width:min(1040px,100%);height:100%;max-height:900px;display:flex;flex-direction:column;background:#fff;border:2px solid #171717;border-radius:16px;overflow:hidden;box-shadow:6px 6px 0 #0670ff}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#dfff45;border-bottom:2px solid #171717}h1{font-size:16px;margin:0;overflow-wrap:anywhere}button{flex-shrink:0;border:0;border-radius:8px;padding:8px 13px;background:#171717;color:#fff;font:inherit;font-size:13px;font-weight:750;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible{outline:3px solid #0670ff;outline-offset:2px}iframe{width:100%;flex:1;min-height:0;border:0;background:white}footer{padding:9px 14px;font-size:11px;color:#575757;background:#f7f7f2;border-top:1px solid #ddd}@media(max-width:480px){body{padding:8px}.dialog{border-radius:10px}header{padding:10px}h1{font-size:14px}}
</style></head><body>
<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="title"><header><h1 id="title">프로그램 준비 중…</h1><button id="close" disabled aria-label="프로그램 창 닫기">닫기 ×</button></header><iframe id="program" title="4번 스탬프 프로그램" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><footer>프로그램을 확인한 뒤 위의 닫기 버튼을 눌러주세요.</footer></section>
<script>
(function(){
  'use strict';
  var close=document.getElementById('close');
  var program=document.getElementById('program');
  var initialized=false;
  function requestClose(){
    if(!initialized)return;
    close.blur();
    try{window.parent.focus();}catch(error){}
    window.parent.postMessage({type:'link_close'},'*');
  }
  close.onclick=requestClose;
  document.addEventListener('keydown',function(event){if(event.key==='Escape')requestClose();});
  window.addEventListener('message',function(event){
    if(event.source!==window.parent||!event.data||event.data.type!=='link_state'||initialized)return;
    var state=event.data;
    if(typeof state.url!=='string'||!/^https:\/\/[^\s/]+(?:\/[^\s]*)?$/.test(state.url))return;
    initialized=true;
    document.getElementById('title').textContent=state.title||'프로그램 참여';
    program.src=state.url;
    close.disabled=false;
  });
  window.parent.postMessage({type:'link_ready'},'*');
}());
</script></body></html>
