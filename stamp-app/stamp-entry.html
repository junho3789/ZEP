<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이벤트 응모 안내</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#171717}body{display:grid;place-items:center;padding:18px 18px calc(100px + env(safe-area-inset-bottom,0px));background:#071326b8}.panel{display:flex;flex-direction:column;width:min(400px,100%);max-height:100%;min-height:0;background:#dfff45;border:2px solid #171717;border-radius:20px;box-shadow:7px 7px 0 #0670ff;overflow:hidden}.body{padding:25px 24px 20px;overflow:auto;min-height:0}.topline{display:flex;align-items:center;justify-content:space-between;font-size:9px;font-weight:900;letter-spacing:1.4px}.tag{border:1px solid #171717;border-radius:20px;padding:4px 7px;font-size:8px}.symbol{display:grid;place-items:center;width:48px;height:48px;margin:23px 0 17px;border:2px solid #171717;border-radius:13px;background:#0670ff;color:#fff;font-weight:900;font-size:28px;box-shadow:3px 3px 0 #171717}h1{font-size:27px;line-height:1.35;letter-spacing:-1px;margin:0 0 12px;font-weight:900}p{font-size:13px;line-height:1.7;margin:0;color:#3b4522}.progress{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:21px;font-size:12px;font-weight:800}.count{color:#0670ff;font-size:26px;letter-spacing:-1px;font-weight:950}.count small{font-size:14px;color:#171717}.track{height:8px;border:1.5px solid #171717;border-radius:8px;overflow:hidden;background:#fff9;margin-top:9px}.fill{height:100%;width:0;background:#0670ff}.hint{margin-top:17px;padding:12px;border:1px dashed #596b18;border-radius:10px;font-size:12px;line-height:1.6;background:#ffffff3d}#entry-actions{flex-shrink:0;padding:0 24px 21px}#entry-close{display:block!important;visibility:visible!important;opacity:1!important;min-height:48px;width:100%;border:2px solid #171717;border-radius:12px;background:#171717;color:#dfff45;font:inherit;font-size:14px;font-weight:850;cursor:pointer;touch-action:manipulation}#entry-close:hover{background:#0670ff;color:#fff}#entry-close:focus-visible{outline:3px solid #0670ff;outline-offset:3px}@media(max-width:360px){body{padding-left:12px;padding-right:12px}.body{padding:19px 18px 16px}h1{font-size:24px}#entry-actions{padding:0 18px 17px}}@media(max-height:480px){body{padding:10px 14px 80px}.body{padding:14px 18px}.symbol{display:none}h1{font-size:21px;margin-top:12px}.progress{margin-top:12px}.hint{margin-top:10px}#entry-actions{padding:9px 18px 12px}}
</style></head><body>
<section class="panel" role="dialog" aria-modal="true" aria-labelledby="entry-title"><div class="body"><div class="topline"><span>NEW:TURN</span><span class="tag">STAMP TOUR</span></div><div class="symbol" aria-hidden="true">!</div><h1 id="entry-title">스탬프를<br>더 모아주세요!</h1><p id="message" role="status" aria-live="polite">수집 현황을 확인하고 있어요.</p><div class="progress"><span>현재 수집 현황</span><span class="count"><span id="count">—</span><small> / <span id="required">—</span></small></span></div><div class="track" id="track" role="progressbar" aria-label="스탬프 수집 현황"><div class="fill" id="fill"></div></div><div class="hint">오브젝트에서 F키로 스탬프를 모은 뒤<br>응모 데스크를 다시 찾아주세요.</div></div><footer class="actions" id="entry-actions"><button class="close" id="entry-close">확인 · 스탬프 모으러 가기</button></footer></section>
<script>
(function(){
  'use strict';
  function close(){document.getElementById('entry-close').blur();try{window.parent.focus();}catch(error){}window.parent.postMessage({type:'entry_close'},'*');}
  document.getElementById('entry-close').onclick=close;
  document.addEventListener('keydown',function(event){if(event.key==='Escape')close();});
  window.addEventListener('message',function(event){
    if(event.source!==window.parent||!event.data||event.data.type!=='entry_state')return;
    var state=event.data;
    if(!Number.isInteger(state.count)||!Number.isInteger(state.required)||state.required<1||state.count<0)return;
    var missing=Math.max(0,state.required-state.count);
    document.getElementById('count').textContent=String(state.count);
    document.getElementById('required').textContent=String(state.required);
    document.getElementById('message').textContent='이벤트에 응모하려면 스탬프 '+missing+'개를 더 모아야 해요.';
    document.getElementById('fill').style.width=Math.min(100,state.count/state.required*100)+'%';
    var track=document.getElementById('track');track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax',String(state.required));track.setAttribute('aria-valuenow',String(state.count));
  });
  window.parent.postMessage({type:'entry_ready'},'*');
}());
</script></body></html>
