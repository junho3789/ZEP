<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캐릭터 대화 편집</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5fc;color:#30283e;font:14px system-ui}main{height:100dvh;display:flex;flex-direction:column}header,footer{padding:16px 22px;background:white;display:flex;gap:8px;align-items:center}header{border-bottom:1px solid #e9e3f3}h1{font-size:20px;margin:0;flex:1}h2{font-size:17px;margin:0 0 12px}button,input,select,textarea{font:inherit}button{border:0;border-radius:8px;padding:10px 14px;background:#6b54cb;color:white;cursor:pointer}button.secondary{background:#ede8f7;color:#51426e}button:disabled{opacity:.5;cursor:default}#scroll{overflow:auto;flex:1;padding:20px 22px;min-height:0}.section{padding:18px;background:white;border-radius:14px;margin-bottom:16px}label{display:block;margin:12px 0 5px;font-weight:600}input,textarea,select{padding:10px;border:1px solid #dcd4e7;border-radius:8px;width:100%;background:white;color:inherit}textarea{min-height:75px;resize:vertical}small,.hint{display:block;color:#7a6e8b;font-size:12px;line-height:1.6}.row{display:flex;gap:12px;align-items:end}.row>*{flex:1}.row>button{flex:none}details{border:1px solid #e7e0f0;border-radius:10px;padding:12px;margin:12px 0}summary{cursor:pointer;font-weight:600}.delete{background:#fff0f1!important;color:#ac3d51!important}#status{flex:1;margin:0;font-size:13px;white-space:pre-wrap}footer{border-top:1px solid #e9e3f3}code{background:#f3effa;border-radius:4px;padding:2px 4px}@media(max-width:550px){.row{display:block}header,footer{padding:12px}#scroll{padding:12px}h1{font-size:17px}}
</style>
<main><header><h1>캐릭터 대화 편집</h1><button id="reload" class="secondary">다시 불러오기</button><button id="close" class="secondary">닫기</button></header><div id="scroll"><div class="section"><label for="npc">편집할 캐릭터</label><select id="npc" disabled></select><div class="row"><div><label for="name">이름</label><input id="name" maxlength="40"></div><div><label for="style">말투 기본값</label><select id="style"></select></div><button id="preset" class="secondary">기본 대사 적용</button></div><label for="personality">성격 소개</label><textarea id="personality" maxlength="500"></textarea><label for="background">배경·공간 안내</label><textarea id="background" maxlength="1000"></textarea><p class="hint">성격은 자기소개에 사용돼요. 말투를 선택하고 ‘기본 대사 적용’을 누르면 기본 주제의 대사가 바뀌어요. 직접 추가한 주제는 유지돼요.</p></div><div class="section"><h2>인사와 모르는 질문</h2><p class="hint">대사는 한 줄에 하나씩, 최대 8개까지 입력해요. <code>{name}</code> 이름 · <code>{player}</code> 유저 이름 · <code>{personality}</code> 성격 · <code>{background}</code> 배경을 사용할 수 있어요.</p><label for="greetings">처음 만났을 때 인사말</label><textarea id="greetings"></textarea><label for="fallbacks">모르는 질문에 할 말</label><textarea id="fallbacks"></textarea></div><div class="section"><h2>주제별 대화</h2><p class="hint">키워드는 쉼표로 구분해요. 공백·문장부호를 제외하고 2자 이상 입력하세요. 더 긴 키워드가 먼저 선택돼요.</p><div id="rules"></div><button id="add" class="secondary">대화 주제 추가</button></div></div><footer><p id="status" role="status">설정을 불러오고 있어요…</p><button id="save" disabled>저장</button></footer></main>
<script>
const $=id=>document.getElementById(id),bridge=data=>window.parent.postMessage(data,'*');let personas={},revision=0,current=null,draft=null,dirty=false,busy=false;
const lines=text=>text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),copy=value=>JSON.parse(JSON.stringify(value));
function status(text){$('status').textContent=text;}
function changed(){dirty=true;status('저장하지 않은 변경 내용이 있어요.');}
function collect(){if(!draft)return;for(const key of ['name','personality','background','style'])draft[key]=$(key).value;for(const key of ['greetings','fallbacks'])draft[key]=lines($(key).value);for(const block of $('rules').children){const r=draft.rules.find(x=>x.id===block.dataset.id);if(!r)continue;for(const field of block.querySelectorAll('[data-field]')){const key=field.dataset.field;r[key]=key==='title'?field.value:key==='keywords'?field.value.split(',').map(x=>x.trim()).filter(Boolean):lines(field.value);}}}
function field(block,label,key,value,kind='textarea'){const name=document.createElement('label');name.textContent=label;const input=document.createElement(kind);input.dataset.field=key;input.value=value;input.maxLength=key==='title'?40:key==='keywords'?1000:4100;input.oninput=changed;block.append(name,input);return input;}
function renderRules(){const target=$('rules');target.replaceChildren();for(const rule of draft.rules){const details=document.createElement('details');details.dataset.id=rule.id;const summary=document.createElement('summary');summary.textContent=rule.title||'새 대화 주제';details.append(summary);field(details,'주제 이름','title',rule.title,'input').oninput=e=>{summary.textContent=e.target.value||'새 대화 주제';changed();};field(details,'키워드 (쉼표로 구분)','keywords',rule.keywords.join(', '),'input');field(details,'기본 답변 (한 줄에 하나)','replies',rule.replies.join('\n'));field(details,'“더 알려줘”에 대한 후속 답변 (선택)','followUps',rule.followUps.join('\n'));field(details,'“응 / 좋아”에 대한 답변 (선택)','acceptReplies',rule.acceptReplies.join('\n'));field(details,'“아니 / 다음에”에 대한 답변 (선택)','declineReplies',rule.declineReplies.join('\n'));const hint=document.createElement('small');hint.textContent='동의·거절 답변을 쓰면 기본 답변은 질문으로 작성하세요. 동의·거절 답변은 둘 다 입력해야 해요.';details.append(hint);const remove=document.createElement('button');remove.type='button';remove.className='delete';remove.textContent='이 주제 삭제';remove.onclick=()=>{collect();draft.rules=draft.rules.filter(x=>x.id!==rule.id);renderRules();changed();};details.append(remove);target.append(details);}}
function render(){for(const key of ['name','personality','background','style'])$(key).value=draft[key];for(const key of ['greetings','fallbacks'])$(key).value=draft[key].join('\n');renderRules();}
function select(id){current=id;draft=copy(personas[id]);dirty=false;render();status('설정을 편집하고 저장해 주세요.');}
function init(data){personas=data.personas;revision=data.revision;const selected=current&&personas[current]?current:Object.keys(personas)[0];$('npc').replaceChildren();for(const [id,p]of Object.entries(personas))$('npc').add(new Option(p.name+' ('+id+')',id));if(data.styles){$('style').replaceChildren();for(const s of data.styles)$('style').add(new Option(s.label,s.id));}if(selected){$('npc').value=selected;select(selected);}busy=false;$('scroll').inert=false;$('npc').disabled=false;$('save').disabled=false;}
$('npc').onchange=()=>{if(busy){$('npc').value=current;return;}if(dirty&&!confirm('저장하지 않은 내용을 버리고 다른 캐릭터를 열까요?')){$('npc').value=current;return;}select($('npc').value);};
for(const id of ['name','personality','background','style','greetings','fallbacks'])$(id).oninput=changed;
$('add').onclick=()=>{if(!draft)return;collect();if(draft.rules.length>=30){status('최대 30개 주제까지 만들 수 있어요.');return;}draft.rules.push({id:'topic_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:'새 대화 주제',keywords:[],replies:[],followUps:[],acceptReplies:[],declineReplies:[]});renderRules();$('rules').lastElementChild.open=true;changed();};
$('preset').onclick=()=>{if(!draft||busy)return;collect();bridge({type:'editor.preset',npcId:current,style:$('style').value});};
$('save').onclick=()=>{if(!draft||busy)return;collect();busy=true;$('scroll').inert=true;$('save').disabled=true;$('npc').disabled=true;status('저장하고 있어요…');bridge({type:'editor.save',npcId:current,expectedRevision:revision,persona:draft});};
$('reload').onclick=()=>{if(busy)return;if(dirty&&!confirm('수정한 내용을 버리고 다시 불러올까요?'))return;bridge({type:'editor.reload'});};
$('close').onclick=()=>{if(dirty&&!confirm('저장하지 않은 내용을 버리고 닫을까요?'))return;bridge({type:'editor.close'});};
window.addEventListener('message',e=>{if(e.source!==window.parent||!e.data)return;const d=e.data;if(d.type==='editor.init')init(d);else if(d.type==='editor.saved'){init(d);status('저장했어요. 다음 대화부터 적용됩니다.');}else if(d.type==='editor.error'){busy=false;$('scroll').inert=false;$('save').disabled=false;$('npc').disabled=false;status(d.error);}else if(d.type==='editor.preset'&&draft){collect();const custom=draft.rules.filter(r=>!r.id.startsWith('builtin_'));draft.rules=d.preset.rules.concat(custom);draft.greetings=d.preset.greetings;draft.fallbacks=d.preset.fallbacks;draft.style=d.preset.style;render();changed();}});
bridge({type:'editor.ready'});
</script></html>
