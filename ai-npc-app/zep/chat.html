<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캐릭터와 대화</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#faf9ff;color:#272238}main{height:100dvh;display:flex;flex-direction:column;padding:18px;gap:12px}header{display:flex;align-items:center;gap:8px}h1{font-size:18px;margin:0;flex:1}button,input{font:inherit}button{border:0;border-radius:10px;padding:10px;background:#6b54cb;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}#edit{background:#ede8fc;color:#554184}#log{flex:1;min-height:0;overflow:auto}article{margin:10px 24px 10px 0;background:white;padding:12px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 5px #31234a08}article.user{margin:10px 0 10px 24px;background:#eae4fc}#suggestions{display:flex;gap:6px;flex-wrap:wrap}#suggestions button{background:white;color:#5d4b91;border:1px solid #e0d8f1;font-size:13px;padding:7px 10px}form{display:flex;gap:8px}input{flex:1;min-width:0;padding:12px;border:1px solid #ddd5ec;border-radius:10px;background:white}#status{min-height:18px;font-size:12px;color:#70647f}[hidden]{display:none!important}
</style>
<main><header><h1>캐릭터와 대화</h1><button id="edit" hidden>캐릭터 편집</button><button id="close" aria-label="대화 닫기">닫기</button></header><div id="log" role="log" aria-live="polite"></div><div id="suggestions" aria-label="대화 주제"></div><div id="status" role="status"></div><form><input id="message" aria-label="메시지" maxlength="1000" placeholder="편하게 말을 걸어보세요" autocomplete="off" disabled><button id="send" disabled>전송</button></form></main>
<script>
const $=id=>document.getElementById(id);let initialized=false,pending=null;
const bridge=data=>window.parent.postMessage(data,'*');
function append(role,text){const node=document.createElement('article');node.className=role==='user'?'user':'assistant';node.textContent=text;$('log').append(node);$('log').scrollTop=$('log').scrollHeight;}
function unlock(){if(pending)clearTimeout(pending.timer);pending=null;$('send').disabled=!initialized;$('message').disabled=!initialized;}
function suggestions(items){$('suggestions').replaceChildren();for(const item of Array.isArray(items)?items:[]){if(typeof item.label!=='string'||typeof item.message!=='string')continue;const b=document.createElement('button');b.type='button';b.textContent=item.label;b.onclick=()=>submit(item.message);$('suggestions').append(b);}}
function submit(text){if(!initialized||pending||!text.trim())return;const message=text.trim().slice(0,1000),requestId=Date.now().toString(36)+Math.random().toString(36).slice(2);append('user',message);$('message').value='';$('send').disabled=true;$('message').disabled=true;$('status').textContent='답변을 준비하고 있어요…';pending={id:requestId,timer:setTimeout(()=>{unlock();$('status').textContent='응답을 받지 못했어요. 다시 말 걸어 주세요.';},5000)};bridge({type:'npc.chat',requestId,message});}
document.querySelector('form').onsubmit=e=>{e.preventDefault();submit($('message').value);};
window.addEventListener('message',e=>{if(e.source!==window.parent||!e.data)return;const d=e.data;if(d.type==='npc.init'&&!initialized){initialized=true;$('log').replaceChildren();$('edit').hidden=!d.canEdit;$('status').textContent='대화할 주제를 골라도 좋아요.';for(const m of d.history||[])if(typeof m.text==='string')append(m.role,m.text);unlock();}else if(d.type==='npc.reply'&&pending&&d.requestId===pending.id){unlock();$('status').textContent=typeof d.error==='string'?d.error:'';if(typeof d.answer==='string')append('assistant',d.answer);$('message').focus();}else return;if(typeof d.name==='string')document.querySelector('h1').textContent=d.name+'와 대화';if(d.suggestions)suggestions(d.suggestions);});
$('close').onclick=()=>bridge({type:'npc.close'});$('edit').onclick=()=>bridge({type:'npc.editor'});bridge({type:'npc.ready'});
</script></html>
