<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캐릭터 설정</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f4fa;color:#282337;font:15px system-ui}main{max-width:760px;margin:32px auto;padding:24px;background:white;border-radius:20px}h1{font-size:24px}label{display:block;margin:18px 0 6px}input,textarea,select,button{font:inherit;padding:12px;border:1px solid #ccc;border-radius:8px}input,textarea,select{width:100%}textarea{min-height:100px;resize:vertical}button{background:#6552cf;color:white;cursor:pointer;margin-top:12px}small{color:#666}#status{white-space:pre-wrap}</style>
<main><h1>AI 캐릭터 설정</h1><p>캐릭터마다 다른 성격과 말투를 설정하세요.</p><label for="token">관리자 인증 키</label><input id="token" type="password" autocomplete="off"><button id="load" type="button">목록 불러오기</button><button id="logout" type="button">로그아웃</button><label for="list">캐릭터 선택</label><select id="list"><option value="">새 캐릭터</option></select>
<form><label for="npcId">캐릭터 ID</label><input id="npcId" required pattern="[a-z0-9_-]{1,64}" placeholder="예: moa"><small>영문 소문자, 숫자, 밑줄, 하이픈. ZEP NPC와 연결할 고유 ID예요.</small><label for="name">이름</label><input id="name" required maxlength="80"><label for="personality">성격</label><textarea id="personality" required maxlength="3000" placeholder="예: 차분하고 다정하며 상대의 이야기를 잘 들어준다"></textarea><label for="speechStyle">말투</label><textarea id="speechStyle" required maxlength="3000" placeholder="예: 부드러운 존댓말. 두세 문장으로 답하고 이모지는 가끔 사용한다"></textarea><label for="background">배경·알고 있는 정보·대화 규칙</label><textarea id="background" required maxlength="3000" placeholder="예: 이 공간의 도서관 안내원. 모르는 운영 정보는 관리자에게 확인하도록 안내한다"></textarea><button id="save">저장</button></form><p id="status" role="status"></p><small>저장한 설정은 다음 AI 요청부터 적용돼요. 변경된 캐릭터는 이전 대화 맥락을 초기화해요.</small></main>
<script>
const $=id=>document.getElementById(id),fields=['name','personality','speechStyle','background'];let personas={},revision=null;
async function api(method,body){const r=await fetch('/admin/personas',{method,headers:{Authorization:'Bearer '+$('token').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'요청 실패');return d;}
function select(){const id=$('list').value,p=personas[id];$('npcId').value=id;$('npcId').readOnly=!!p;revision=p?.revision||null;for(const f of fields)$(f).value=p?.[f]||'';}
function render(selected=''){const list=$('list');list.replaceChildren(new Option('새 캐릭터',''));for(const [id,p]of Object.entries(personas))list.add(new Option(p.name+' ('+id+')',id));list.value=selected;select();}
$('list').onchange=select;
$('load').onclick=async()=>{try{personas=(await api('GET')).personas;render();$('status').textContent='목록을 불러왔어요.';}catch(e){$('status').textContent=e.message;}};
$('logout').onclick=()=>{$('token').value='';personas={};render();$('status').textContent='로그아웃했어요.';};
document.querySelector('form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{const data={npcId:$('npcId').value,expectedRevision:revision};for(const f of fields)data[f]=$(f).value;const d=await api('PUT',data);personas[d.npcId]=d.persona;render(d.npcId);$('status').textContent='저장했어요.';}catch(e){$('status').textContent=e.message;}finally{$('save').disabled=false;}};
</script></html>
